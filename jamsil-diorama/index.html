<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="잠실역 사거리, 롯데월드타워, 석촌호수를 손으로 배치한 토이 3D 디오라마">

<style>
/* Layout: full-bleed 3D stage. A museum-style placard sits top-left like the label card
   beside a real diorama; the controls ride a pill rail along the bottom edge. */
:root {
  --bg: #dbe7ea;
  --panel: #fffaf2;
  --ink: #27303a;
  --muted: #65707c;
  --line: rgba(39, 48, 58, 0.14);
  --shadow: rgba(30, 38, 48, 0.16);
  --l2: #2f9e3c;          /* 2호선 green */
  --l8: #e2156b;          /* 8호선 pink */
  --f-display: "Jua", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171f; --panel: #1c232d; --ink: #eef1f4; --muted: #9ca7b3;
    --line: rgba(238, 241, 244, 0.14); --shadow: rgba(0, 0, 0, 0.45);
    --l2: #46b553; --l8: #ff4d91; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171f; --panel: #1c232d; --ink: #eef1f4; --muted: #9ca7b3;
  --line: rgba(238, 241, 244, 0.14); --shadow: rgba(0, 0, 0, 0.45);
  --l2: #46b553; --l8: #ff4d91; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body);
  overflow: hidden; padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; touch-action: none; }
#labels { position: fixed; inset: 0; pointer-events: none; }

.placard {
  position: fixed; z-index: 5;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  left: max(16px, env(safe-area-inset-left, 0px));
  width: min(330px, calc(100vw - 32px));
  background: color-mix(in srgb, var(--panel) 93%, transparent);
  border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px 12px; box-shadow: 0 10px 28px var(--shadow);
  display: grid; gap: 6px;
}
.eyebrow { font: 500 11px/1.2 var(--f-mono); letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.placard h1 { margin: 0; font: 400 30px/1.05 var(--f-display); letter-spacing: 0.01em; text-wrap: balance; }
.lines { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12.5px; }
.lines span.item { display: inline-flex; align-items: center; gap: 5px; }
.ln {
  display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%;
  font: 600 11px/1 var(--f-body); color: #fff;
}
.ln.l2 { background: var(--l2); }
.ln.l8 { background: var(--l8); }
.coord { font: 400 11.5px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.note { margin: 2px 0 0; font-size: 12.5px; line-height: 1.55; color: var(--muted); }
.clock { font: 500 11.5px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

.rail {
  position: fixed; z-index: 5; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
  width: max-content; max-width: calc(100vw - 32px);
}
.group {
  display: flex; flex-wrap: wrap; gap: 2px; padding: 3px;
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 6px 18px var(--shadow);
}
.rail button {
  font: 500 13px/1 var(--f-body); color: var(--ink); background: transparent;
  border: 0; border-radius: 999px; padding: 8px 12px; cursor: pointer;
}
.rail button:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.rail button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.rail button:focus-visible { outline: 2px solid var(--l2); outline-offset: 2px; }

.hint {
  position: fixed; z-index: 4;
  right: max(16px, env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 18px);
  font: 400 11px var(--f-mono); color: var(--muted);
  background: color-mix(in srgb, var(--panel) 80%, transparent);
  padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line);
}
.fail { color: var(--l8); font-size: 13px; }

/* Floating name tags pinned to the model */
.pin { position: relative; }
.tag {
  transform: translateY(-120%);
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  font: 500 12px/1 var(--f-body); color: var(--ink);
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px;
  box-shadow: 0 4px 12px var(--shadow);
}
.tag small { font: 400 10.5px var(--f-mono); color: var(--muted); }
.tag.station { font: 400 15px/1 var(--f-display); padding: 6px 11px 6px 7px; }
.tag.minor { }
.tag.road {
  transform: none; background: transparent; border: 0; box-shadow: none; padding: 0;
  font: 500 11px/1 var(--f-mono); letter-spacing: 0.12em; color: #f6f3ea;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
}

@media (max-width: 720px) {
  .hint { display: none; }
  .tag.minor, .tag.road { display: none; }
  .placard { padding: 11px 13px 10px; gap: 4px; }
  .placard h1 { font-size: 24px; }
  .note { font-size: 11.5px; }
  .rail button { padding: 7px 10px; font-size: 12.5px; }
}
@media (max-width: 420px) {
  .note { display: none; }
}

<script type="importmap">
{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { HorizontalTiltShiftShader } from 'three/addons/shaders/HorizontalTiltShiftShader.js';
import { VerticalTiltShiftShader } from 'three/addons/shaders/VerticalTiltShiftShader.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------ *
 * World units: 1 unit = 10 m. x = east, z = south, origin = 잠실역 사거리.
 * Tall buildings are height-compressed above 60 m so the tower stays toy-like.
 * ------------------------------------------------------------------ */
const H = m => (m <= 60 ? m : 60 + (m - 60) * 0.42) * 0.1;
const X0 = -58, X1 = 58, Z0 = -44, Z1 = 68;     // diorama board bounds
const PAD = 0.14;                               // curb height of city blocks

let seed = 20261109;
function rand() {
  seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rr = (a, b) => a + (b - a) * rand();
const pick = a => a[Math.floor(rand() * a.length)];

/* ---------------- renderer / scene / camera ---------------- */
const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('note').innerHTML = '<span class="fail">이 브라우저에서 WebGL을 켤 수 없어 3D 장면을 그리지 못했어요. 다른 브라우저나 기기에서 열어 주세요.</span>';
  throw e;
}
const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 1, 4000);
const HOME_TARGET = new THREE.Vector3(0, 2, 12);
const HOME_DIR = new THREE.Vector3(96, 90, 126);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.id = 'labels';
document.body.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 22;
controls.maxDistance = 330;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = 1.33;
controls.screenSpacePanning = false;
controls.autoRotateSpeed = 0.55;
controls.addEventListener('change', () => {
  const t = controls.target;
  t.x = THREE.MathUtils.clamp(t.x, X0, X1);
  t.z = THREE.MathUtils.clamp(t.z, Z0, Z1);
  t.y = THREE.MathUtils.clamp(t.y, 0, 20);
});

function goHome() {
  const aspect = innerWidth / innerHeight;
  const k = aspect < 1 ? Math.pow(1 / aspect, 0.85) : 1;
  controls.target.copy(HOME_TARGET);
  camera.position.copy(HOME_TARGET).addScaledVector(HOME_DIR, k);
  controls.update();
}

/* ---------------- sky, stars, lights ---------------- */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { top: { value: new THREE.Color() }, bottom: { value: new THREE.Color() } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying vec3 vP; void main(){ float t = smoothstep(-0.15, 0.65, vP.y); gl_FragColor = vec4(mix(bottom, top, t), 1.0); }'
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1800, 32, 16), skyMat));

const starGeo = new THREE.BufferGeometry();
{
  const p = [];
  for (let i = 0; i < 420; i++) {
    const th = rand() * Math.PI * 2, y = rr(0.12, 1);
    const r = Math.sqrt(1 - y * y);
    p.push(Math.cos(th) * r * 1600, y * 1600, Math.sin(th) * r * 1600);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
}
const starMat = new THREE.PointsMaterial({ color: '#ffffff', size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0, depthWrite: false });
scene.add(new THREE.Points(starGeo, starMat));

const hemi = new THREE.HemisphereLight();
scene.add(hemi);
const sun = new THREE.DirectionalLight();
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -82, right: 82, top: 82, bottom: -82, near: 1, far: 420 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.035;
sun.target.position.set(0, 0, 12);
scene.add(sun, sun.target);

const LIGHT = {
  day:   { skyTop: '#8fc9ee', skyBottom: '#eaf5f7', hemiSky: '#e4f1ff', hemiGround: '#bba98c', hemiI: 1.55, sun: '#fff0d8', sunI: 2.5, sunPos: new THREE.Vector3(58, 92, 34) },
  night: { skyTop: '#070d1f', skyBottom: '#1f2a4a', hemiSky: '#4a5f93', hemiGround: '#1c2030', hemiI: 0.55, sun: '#a9c0ff', sunI: 0.55, sunPos: new THREE.Vector3(-46, 80, -28) }
};

/* ---------------- materials & textures ---------------- */
const matCache = {};
function std(color, extra = {}) {
  const key = color + JSON.stringify(extra);
  if (!matCache[key]) matCache[key] = new THREE.MeshStandardMaterial({ color, roughness: 0.85, ...extra });
  return matCache[key];
}

function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
// 4×4 window cells per texture; the lit variant is the night emissive map.
function windowTex(kind, lit) {
  const t = canvasTex(128, 128, (g) => {
    g.fillStyle = lit ? '#000' : '#fff'; g.fillRect(0, 0, 128, 128);
    for (let r = 0; r < 4; r++) for (let q = 0; q < 4; q++) {
      const x = q * 32, y = r * 32;
      if (lit) {
        if (rand() > 0.36) continue;
        g.fillStyle = rand() < 0.5 ? '#ffd38a' : '#fff1d2';
      } else g.fillStyle = kind === 'apt' ? '#c2d3e0' : '#b6c7d7';
      if (kind === 'apt') g.fillRect(x + 1, y + 8, 30, 16); else g.fillRect(x + 6, y + 8, 20, 18);
      if (!lit && kind === 'apt') { g.fillStyle = '#ffffff'; g.fillRect(x + 15, y + 8, 2, 16); }
    }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const TEX = { office: windowTex('office', false), apt: windowTex('apt', false) };
const TEXLIT = { office: windowTex('office', true), apt: windowTex('apt', true) };
const PERIOD = { office: [1.68, 1.36], apt: [2.0, 1.12] };   // 4 windows wide, 4 floors tall

const wallMats = [];
const wallCache = {};
function wallMat(color, kind) {
  const k = color + kind;
  if (!wallCache[k]) {
    const m = new THREE.MeshStandardMaterial({
      color, map: TEX[kind], emissiveMap: TEXLIT[kind], emissive: new THREE.Color('#ffc46b'),
      emissiveIntensity: 0, roughness: 0.82
    });
    wallCache[k] = m; wallMats.push(m);
  }
  return wallCache[k];
}
const roofMats = [];
const roofCache = {};
function roofMat(color) {
  if (!roofCache[color]) {
    const m = new THREE.MeshStandardMaterial({ color, roughness: 0.9 });
    m.userData.base = new THREE.Color(color);
    roofCache[color] = m; roofMats.push(m);
  }
  return roofCache[color];
}

function wallBox(w, h, d, kind) {
  const g = new THREE.BoxGeometry(w, h, d);
  if (kind === 'plain') return g;
  const [pw, ph] = PERIOD[kind];
  const uv = g.attributes.uv;
  for (let f = 0; f < 6; f++) {
    if (f === 2 || f === 3) continue;          // roof / floor faces
    const fw = f < 2 ? d : w;
    for (let i = 0; i < 4; i++) {
      const idx = f * 4 + i;
      uv.setXY(idx, uv.getX(idx) * fw / pw, uv.getY(idx) * h / ph);
    }
  }
  return g;
}

/* ---------------- board (base) ---------------- */
function rrShape(x0, x1, z0, z1, r = [0.3, 0.3, 0.3, 0.3]) {   // r = [NW, NE, SE, SW]
  const [nw, ne, se, sw] = r, yb = -z1, yt = -z0, s = new THREE.Shape();
  s.moveTo(x0 + sw, yb); s.lineTo(x1 - se, yb); s.quadraticCurveTo(x1, yb, x1, yb + se);
  s.lineTo(x1, yt - ne); s.quadraticCurveTo(x1, yt, x1 - ne, yt);
  s.lineTo(x0 + nw, yt); s.quadraticCurveTo(x0, yt, x0, yt - nw);
  s.lineTo(x0, yb + sw); s.quadraticCurveTo(x0, yb, x0 + sw, yb);
  return s;
}
function slab(shape, top, thick, mat, seg = 10) {
  const g = new THREE.ExtrudeGeometry(shape, { depth: thick, bevelEnabled: false, curveSegments: seg });
  g.rotateX(-Math.PI / 2);
  g.translate(0, top - thick, 0);
  const m = new THREE.Mesh(g, mat);
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

// Seokchon Lake: 서호 (west, with Magic Island) and 동호 (east), split by 송파대로.
const LAKES = [
  { cx: -25, cz: 47, rx: 19, rz: 14, rot: 0.15, name: '석촌호수 서호' },
  { cx: 27, cz: 47, rx: 21, rz: 12, rot: -0.12, name: '석촌호수 동호' }
];
function ellipsePoint(L, t, grow = 0) {
  const u = (L.rx + grow) * Math.cos(t), v = (L.rz + grow) * Math.sin(t);
  const c = Math.cos(L.rot), s = Math.sin(L.rot);
  return [L.cx + u * c - v * s, L.cz + u * s + v * c];
}
function inEllipse(L, x, z, grow = 0) {
  const dx = x - L.cx, dz = z - L.cz, c = Math.cos(L.rot), s = Math.sin(L.rot);
  const u = dx * c + dz * s, v = -dx * s + dz * c;
  return (u / (L.rx + grow)) ** 2 + (v / (L.rz + grow)) ** 2 <= 1;
}
function ellipsePath(L, grow = 0, n = 96, Ctor = THREE.Shape) {
  const p = new Ctor();
  for (let i = 0; i <= n; i++) {
    const [x, z] = ellipsePoint(L, (i / n) * Math.PI * 2, grow);
    if (i === 0) p.moveTo(x, -z); else p.lineTo(x, -z);
  }
  return p;
}

const grassMat = new THREE.MeshStandardMaterial({ color: '#a9cf7c', roughness: 0.95 });
const aptGroundMat = new THREE.MeshStandardMaterial({ color: '#b8dc8c', roughness: 0.95 });
const plazaMat = new THREE.MeshStandardMaterial({ color: '#e8e1d6', roughness: 0.9 });
const waterMat = new THREE.MeshStandardMaterial({ color: '#73bfe0', roughness: 0.18, metalness: 0.05 });

{
  const top = rrShape(X0, X1, Z0, Z1, [6, 6, 6, 6]);
  LAKES.forEach(L => top.holes.push(ellipsePath(L, 0, 96, THREE.Path)));
  slab(top, 0, 0.3, grassMat, 14);
  const body = rrShape(X0, X1, Z0, Z1, [6, 6, 6, 6]);
  slab(body, -0.3, 4.2, std('#b5845b', { roughness: 1 }), 14);
  slab(body, -4.5, 0.9, std('#8d6548', { roughness: 1 }), 14);
  const plinth = slab(rrShape(X0 - 1.2, X1 + 1.2, Z0 - 1.2, Z1 + 1.2, [7.2, 7.2, 7.2, 7.2]), -5.4, 1.7, std('#3c3843', { roughness: 0.6 }), 14);
  plinth.castShadow = true;

  // water + lake trail
  LAKES.forEach(L => {
    const wg = new THREE.ShapeGeometry(ellipsePath(L, 0.05), 1);
    wg.rotateX(-Math.PI / 2);
    const w = new THREE.Mesh(wg, waterMat); w.position.y = -0.12; w.receiveShadow = true; scene.add(w);
    const ring = ellipsePath(L, 1.5); ring.holes.push(ellipsePath(L, 0.02, 96, THREE.Path));
    const rg = new THREE.ShapeGeometry(ring, 1); rg.rotateX(-Math.PI / 2);
    const rm = new THREE.Mesh(rg, std('#e9dcc2', { polygonOffset: true, polygonOffsetFactor: -1 }));
    rm.position.y = 0.02; rm.receiveShadow = true; scene.add(rm);
  });

  // brass plaque on the south face of the plinth
  const plaque = canvasTex(1024, 150, (g, w, h) => {

function canTree(x, z, r = 0.55) {
  if (x < X0 + 1 || x > X1 - 1 || z < Z0 + 1 || z > Z1 - 1) return false;
  // rounded board corners (radius 6, centre of board at z = 12)
  const qx = Math.max(Math.abs(x) - (X1 - 6), 0), qz = Math.max(Math.abs(z - 12) - (Z1 - 12 - 6), 0);
  if (Math.hypot(qx, qz) > 5) return false;
  if (onRoad(x, z, 0.45)) return false;
  if (LAKES.some(L => inEllipse(L, x, z, 1.6))) return false;
  if (blocked(x, z, r)) return false;
  return !trees.some(t => (t.x - x) ** 2 + (t.z - z) ** 2 < 1.0);
}

function signalState(grp, t) {
  const ph = (t + (grp.endsWith('2') ? 6 : 0)) % 18;
  if (grp.startsWith('EW')) return ph < 7 ? 'G' : ph < 9 ? 'Y' : 'R';
  return ph < 9 ? 'R' : ph < 16 ? 'G' : 'Y';
}
const dummy = new THREE.Object3D();
function updateTraffic(dt, t) {
  lanes.forEach(ln => {
    const V = ln.veh;
    V.sort((a, b) => b.s - a.s);
    for (let i = 0; i < V.length; i++) {
      const v = V[i];
      let gap = 99;
      if (V.length > 1) {
        const lead = i === 0 ? V[V.length - 1] : V[i - 1];
        gap = (i === 0 ? lead.s + ln.L : lead.s) - v.s - (lead.len + v.len) / 2;
      }
      for (const st of ln.stops) {
        if (signalState(st.grp, t) === 'G') continue;
        const dist = st.s - (v.s + v.len / 2);
        if (dist > -0.05 && dist < gap) gap = dist;
      }
      const target = Math.max(0, Math.min(v.vmax, (gap - 0.3) * 2.2));
      v.v += (target - v.v) * Math.min(1, dt * 3);
      if (gap < 0.02) v.v = 0;
      v.s += v.v * dt;
      if (v.s > ln.L) v.s -= ln.L;
      const p = ln.start + ln.dir * v.s;
      const sc = THREE.MathUtils.clamp(Math.min(v.s, ln.L - v.s) / 1.2, 0.001, 1);
      dummy.position.set(ln.axis === 'x' ? p : ln.c, 0.04, ln.axis === 'x' ? ln.c : p);
      dummy.rotation.set(0, ln.axis === 'x' ? (ln.dir > 0 ? 0 : Math.PI) : (ln.dir > 0 ? -Math.PI / 2 : Math.PI / 2), 0);
      dummy.scale.setScalar(sc);
      dummy.updateMatrix();
      (v.bus ? busMesh : carMesh).setMatrixAt(v.idx, dummy.matrix);
    }
  });
  carMesh.instanceMatrix.needsUpdate = true;
  busMesh.instanceMatrix.needsUpdate = true;
  const col = { G: '#56d364', Y: '#ffc94d', R: '#ff5a5a' };
  signalHeads.forEach(h => h.lamp.material.color.set(col[signalState(h.grp, t)]));
}

label('갤러리아팰리스', -11, PAD + H(160) + 0.6, -11.8, 'minor');
label('잠실주공5단지', 22.5, PAD + H(42) + 1.4, -24);
label('송파구청', 51.4, PAD + H(30) + 0.6, -9.5, 'minor');
label('올림픽로', -48, 0.08, 0, 'road');
label('올림픽로', 48, 0.08, 0, 'road');
label('송파대로', 0, 0.08, -36, 'road');
label('잠실로', 50, 0.08, 28, 'road');

/* ---------------- post: tilt-shift ---------------- */
const rt = new THREE.WebGLRenderTarget(innerWidth * DPR, innerHeight * DPR, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const hBlur = new ShaderPass(HorizontalTiltShiftShader);
const vBlur = new ShaderPass(VerticalTiltShiftShader);
composer.addPass(hBlur); composer.addPass(vBlur);
composer.addPass(new OutputPass());
function sizeBlur() {
  hBlur.uniforms.h.value = 4.5 / innerWidth; hBlur.uniforms.r.value = 0.48;
  vBlur.uniforms.v.value = 4.5 / innerHeight; vBlur.uniforms.r.value = 0.48;
}
sizeBlur();

/* ---------------- state: day/night, season ---------------- */
const SEASONS = {
  spring: { grass: '#a8d27a', apt: '#b8dc8c', water: '#74c0e2', snow: false, cherry: ['#f7b6cc', '#f9c9da', '#f3a5c0'], ginkgo: ['#b5dc7a', '#a7d36d'], tree: ['#8fca6a', '#7dbd5f', '#9fd27a'] },
  summer: { grass: '#8dc463', apt: '#9fd172', water: '#5db3db', snow: false, cherry: ['#5aa957', '#4f9f4f'], ginkgo: ['#64b553', '#5aa94c'], tree: ['#4d9d4c', '#5aaa52', '#3f8f45'] },
  autumn: { grass: '#bcc477', apt: '#c8ca82', water: '#6aaed0', snow: false, cherry: ['#e0784e', '#d9643f', '#e8955c'], ginkgo: ['#f4c63c', '#f0b92e', '#f7d35a'], tree: ['#e09a3c', '#c95b3a', '#d9b347', '#b8743a', '#6fa253'] },
  winter: { grass: '#eef2f4', apt: '#f2f5f7', water: '#bcd9e8', snow: true, cherry: ['#e9eef1'], ginkgo: ['#e6ecef'], tree: ['#e3eaee', '#edf1f3', '#d6e1e6'] }
};
const SNOW = new THREE.Color('#f4f7f9');
function applySeason(name) {
  const S = SEASONS[name];
  grassMat.color.set(S.grass); aptGroundMat.color.set(S.apt); waterMat.color.set(S.water);
  roofMats.forEach(m => m.color.copy(S.snow ? SNOW : m.userData.base));
  const c = new THREE.Color();
  trees.forEach((t, i) => {
    const arr = S[t.kind];
    c.set(arr[Math.floor(t.j * arr.length) % arr.length]).offsetHSL(0, 0, (t.j - 0.5) * 0.06);
    crownMesh.setColorAt(i, c);
  });
  crownMesh.instanceColor.needsUpdate = true;
  document.querySelectorAll('[data-season]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.season === name)));
  state.season = name;
}

const state = { night: false, nightT: 0, season: 'autumn', tilt: true, labels: true };
const tmpA = new THREE.Color(), tmpB = new THREE.Color();
function lerpC(target, a, b, t) { target.copy(tmpA.set(a)).lerp(tmpB.set(b), t); }
function applyLight(t) {
  const D = LIGHT.day, N = LIGHT.night;
  lerpC(skyMat.uniforms.top.value, D.skyTop, N.skyTop, t);
  lerpC(skyMat.uniforms.bottom.value, D.skyBottom, N.skyBottom, t);
  lerpC(hemi.color, D.hemiSky, N.hemiSky, t);
  lerpC(hemi.groundColor, D.hemiGround, N.hemiGround, t);
  hemi.intensity = THREE.MathUtils.lerp(D.hemiI, N.hemiI, t);
  lerpC(sun.color, D.sun, N.sun, t);
  sun.intensity = THREE.MathUtils.lerp(D.sunI, N.sunI, t);
  sun.position.lerpVectors(D.sunPos, N.sunPos, t).add(sun.target.position);
  wallMats.forEach(m => (m.emissiveIntensity = t * 0.75));
  towerMat.emissiveIntensity = t * 0.75;
  lanternMat.emissiveIntensity = 0.25 + t * 2.2;
  lampBulbMat.emissiveIntensity = t * 2.6;
  glowMat.opacity = t * 0.42;
  starMat.opacity = t;
}
function setNight(on) {
  state.night = on;
  document.getElementById('b-day').setAttribute('aria-pressed', String(!on));
  document.getElementById('b-night').setAttribute('aria-pressed', String(on));
}

/* Seoul time decides the opening scene: evening hours open at night, the month picks the season */
function seoulNow() {
  const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', month: 'numeric', hour12: false }).formatToParts(new Date());
  const get = k => parts.find(p => p.type === k)?.value;
  return { h: +get('hour'), m: get('minute'), mon: +get('month') };
}
function tickClock() { const n = seoulNow(); document.getElementById('clock').textContent = `${String(n.h).padStart(2, '0')}:${n.m}`; }
{
  const n = seoulNow();
  const night = n.h >= 18 || n.h < 6;
  setNight(night); state.nightT = night ? 1 : 0; applyLight(state.nightT);
  applySeason(n.mon >= 3 && n.mon <= 5 ? 'spring' : n.mon <= 8 && n.mon >= 6 ? 'summer' : n.mon >= 9 && n.mon <= 11 ? 'autumn' : 'winter');
  tickClock(); setInterval(tickClock, 20000);
}

/* ---------------- UI ---------------- */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
document.getElementById('b-day').addEventListener('click', () => setNight(false));
document.getElementById('b-night').addEventListener('click', () => setNight(true));
document.querySelectorAll('[data-season]').forEach(b => b.addEventListener('click', () => applySeason(b.dataset.season)));
const toggle = (id, key, fn) => {
  const b = document.getElementById(id);
  b.addEventListener('click', () => { state[key] = !state[key]; b.setAttribute('aria-pressed', String(state[key])); fn(state[key]); });
};
toggle('b-tilt', 'tilt', on => { hBlur.enabled = vBlur.enabled = on; });
toggle('b-labels', 'labels', on => { labelRenderer.domElement.hidden = !on; });
state.rotate = false;
toggle('b-rotate', 'rotate', on => { controls.autoRotate = on; });
document.getElementById('b-home').addEventListener('click', goHome);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  sizeBlur();
});

/* ---------------- loop ---------------- */
goHome();
const clock = new THREE.Clock();
let simT = 0;
function frame() {
  const rawDt = clock.getDelta();
  const dt = Math.min(rawDt, 0.05);
  simT += dt;
  const goal = state.night ? 1 : 0;
  if (Math.abs(state.nightT - goal) > 0.001) {
    state.nightT += Math.sign(goal - state.nightT) * Math.min(Math.abs(goal - state.nightT), Math.min(rawDt, 0.25) / 1.2);
    applyLight(state.nightT);
  }
  updateTraffic(dt, simT);
  // gyro drop: slow climb, pause, drop
  const gp = simT % 11, gb = PAD + 0.04 + 0.6;
  gyroRing.position.y = gp < 6 ? gb + (gp / 6) * 5.7 : gp < 7 ? gb + 5.7 : gp < 7.6 ? gb + 5.7 * (1 - ((gp - 7) / 0.6) ** 2) : gb;
  gyroRing.rotation.z = simT * 0.6;
  const u = (simT * 0.07) % 1;
  coasterCart.position.copy(coasterCurve.getPointAt(u)).y += 0.13;
  coasterCart.lookAt(coasterCurve.getPointAt((u + 0.01) % 1).add(new THREE.Vector3(0, 0.13, 0)));
  coasterCart.rotateY(Math.PI / 2);
  balloons.forEach(b => { b.position.y = b.userData.y0 + Math.sin(simT * 0.8 + b.userData.ph) * 0.35; });
  ducks.forEach(d => {
    const ud = d.userData; ud.t += ud.sp * dt;
    const [x, z] = ellipsePoint(ud.L, ud.t, ud.grow);
    const [x2, z2] = ellipsePoint(ud.L, ud.t + Math.sign(ud.sp) * 0.02, ud.grow);
    d.position.x = x; d.position.z = z; d.rotation.y = -Math.atan2(z2 - z, x2 - x);
    d.position.y = -0.08 + Math.sin(simT * 2 + ud.t * 9) * 0.015;
  });
  controls.update();
  composer.render();
  if (state.labels) labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}
if (reduceMotion) controls.autoRotate = false;
frame();
</script>
